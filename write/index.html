layout: default
title: 글쓰기
permalink: /write/

<h1>새 글 작성</h1>
<p class="intro">
  아래 내용을 채우고 <strong>파일 다운로드</strong>를 누르면 올바른 형식의 마크다운 파일이 생성됩니다.
  받은 파일을 <code>_posts/</code> 폴더에 넣고 git으로 커밋 &amp; 푸시하면 글이 게시됩니다.
</p>

<form id="post-form" class="write-form">
  <label>
    제목 <span class="req">*</span>
    <input type="text" id="f-title" required placeholder="예: 첫 번째 글">
  </label>

  <label>
    시리즈(카테고리) <span class="req">*</span>
    <input type="text" id="f-series" required placeholder="예: 회고, 개발노트, 여행">
  </label>

  <label>
    태그 <span class="hint">(쉼표로 구분)</span>
    <input type="text" id="f-tags" placeholder="예: jekyll, github-pages">
  </label>

  <label>
    발행일
    <input type="date" id="f-date">
  </label>

  <label>
    본문 <span class="hint">(마크다운)</span>
    <textarea id="f-content" rows="14" placeholder="여기에 글을 작성하세요..."></textarea>
  </label>

  <div class="write-actions">
    <button type="submit">파일 다운로드</button>
    <button type="button" id="copy-btn">클립보드에 복사</button>
  </div>
</form>

<div id="preview-wrap" hidden>
  <h2>미리보기 (front matter)</h2>
  <pre id="preview"></pre>
  <p class="hint" id="filename-hint"></p>
</div>

<script>
(function () {
  var form = document.getElementById('post-form');
  var copyBtn = document.getElementById('copy-btn');
  var previewWrap = document.getElementById('preview-wrap');
  var preview = document.getElementById('preview');
  var filenameHint = document.getElementById('filename-hint');

  document.getElementById('f-date').valueAsDate = new Date();

  function slugify(str) {
    return str
      .trim()
      .toLowerCase()
      .replace(/["'`]/g, '')
      .replace(/[\s]+/g, '-')
      .replace(/[^\p{L}\p{N}-]/gu, '');
  }

  function buildPost() {
    var title = document.getElementById('f-title').value.trim();
    var series = document.getElementById('f-series').value.trim();
    var tagsRaw = document.getElementById('f-tags').value.trim();
    var date = document.getElementById('f-date').value || new Date().toISOString().slice(0, 10);
    var content = document.getElementById('f-content').value;

    var tags = tagsRaw
      ? tagsRaw.split(',').map(function (t) { return t.trim(); }).filter(Boolean)
      : [];

    var frontMatter = [
      '---',
      'layout: post',
      'title: "' + title.replace(/"/g, '\\"') + '"',
      'series: ' + series,
      'tags: [' + tags.join(', ') + ']',
      '---',
      '',
      content,
      ''
    ].join('\n');

    var slug = slugify(title) || 'untitled';
    var filename = date + '-' + slug + '.md';

    return { frontMatter: frontMatter, filename: filename, title: title, series: series };
  }

  function validate() {
    var title = document.getElementById('f-title').value.trim();
    var series = document.getElementById('f-series').value.trim();
    if (!title) {
      alert('제목을 입력해주세요.');
      return false;
    }
    if (!series) {
      alert('시리즈(카테고리)는 필수 입력입니다.');
      return false;
    }
    return true;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!validate()) return;

    var post = buildPost();
    var blob = new Blob([post.frontMatter], { type: 'text/markdown;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = post.filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    preview.textContent = post.frontMatter;
    filenameHint.textContent = '파일명: _posts/' + post.filename;
    previewWrap.hidden = false;
  });

  copyBtn.addEventListener('click', function () {
    if (!validate()) return;
    var post = buildPost();
    navigator.clipboard.writeText(post.frontMatter).then(function () {
      preview.textContent = post.frontMatter;
      filenameHint.textContent = '파일명: _posts/' + post.filename + ' (클립보드에 복사됨)';
      previewWrap.hidden = false;
    });
  });
})();
</script>
