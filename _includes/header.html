<header class="site-header">
  <div class="wrap{% if page.url == '/write/' %} wrap-wide{% endif %}{% if page.url == '/' %} wrap-home{% endif %}">
    <div class="site-header-top">
      <a class="site-title" href="{{ '/' | relative_url }}">
        <img class="mascot" src="{{ '/assets/img/mascot.png' | relative_url }}" alt="">
        {{ site.title }}
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="is-active"{% endif %}>홈</a>
        <a href="{{ '/series/' | relative_url }}"{% if page.url == '/series/' %} class="is-active"{% endif %}>시리즈</a>
        <a href="{{ '/write/' | relative_url }}"{% if page.url == '/write/' %} class="is-active"{% endif %}>글쓰기</a>
      </nav>
    </div>
    {% if page.url == '/' %}
    <div class="site-header-profile">
      <p class="profile-bio">{{ site.data.profile.bio }}</p>
      <ul class="profile-links">
        <li>✉️ <a href="mailto:{{ site.data.profile.email }}">{{ site.data.profile.email }}</a></li>
        {% for link in site.data.profile.links %}
        <li>🔗 <a href="{{ link.url }}" target="_blank" rel="noopener">{{ link.label }}</a></li>
        {% endfor %}
      </ul>
    </div>
    {% endif %}
  </div>
</header>
